<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="15" fill="url(#gradient)" stroke="#60a5fa" stroke-width="2"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Letter L -->
  <text x="16" y="22" text-anchor="middle" fill="white" font-family="serif" font-size="12" font-weight="bold">L</text>
</svg>
